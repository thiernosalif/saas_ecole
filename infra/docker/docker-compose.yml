# infra/docker/docker-compose.yml
#
# cf. PROJET_LARAVEL.md §8. Un seul conteneur applicatif (`app`, PHP-FPM +
# Laravel) : les assets Tailwind + Alpine sont compilés au build de l'image
# (Vite) et servis par Laravel lui-même depuis public/build/ ; Livewire ne
# nécessite aucun serveur JS séparé.
#
# Ce fichier vit dans infra/docker/ (cf. §11) : les chemins de build/volume
# sont donc relatifs à ce dossier (../.. = racine du monorepo). Lancer avec :
#   docker compose -f infra/docker/docker-compose.yml up -d
# Les variables ${...} sont lues depuis infra/docker/.env (cf. .env.example
# à côté de ce fichier — distinct du .env Laravel à la racine du repo).

name: saas-ecole

networks:
  saas-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: saas-ecole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_ecole
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [saas-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas-ecole-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [saas-net]

  minio:
    image: minio/minio:latest
    container_name: saas-ecole-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [saas-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    container_name: saas-ecole-createbuckets
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    networks: [saas-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/saas-ecole
      "

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: saas-ecole-app
    restart: unless-stopped
    environment: &app-env
      APP_NAME: "SaaS École"
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_URL: http://plateforme.sn.localhost
      SESSION_DRIVER: redis
      SESSION_DOMAIN: .plateforme.sn.localhost   # cookie partagé entre sous-domaines écoles
      SANCTUM_STATEFUL_DOMAINS: plateforme.sn.localhost,*.plateforme.sn.localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: saas_ecole
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: s3
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_BUCKET: saas-ecole
      AWS_DEFAULT_REGION: us-east-1
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    volumes:
      - ../..:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    networks: [saas-net]

  queue:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: saas-ecole-queue
    restart: unless-stopped
    command: php artisan horizon
    environment: *app-env
    volumes:
      - ../..:/var/www/html
    depends_on: [app, redis]
    networks: [saas-net]

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: saas-ecole-scheduler
    restart: unless-stopped
    command: php artisan schedule:work   # rappels J-7/J-3, suspension auto, etc.
    environment: *app-env
    volumes:
      - ../..:/var/www/html
    depends_on: [app]
    networks: [saas-net]

  nginx:
    image: nginx:alpine
    container_name: saas-ecole-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ../..:/var/www/html
    ports: ["80:80", "443:443"]
    depends_on: [app]
    networks: [saas-net]
