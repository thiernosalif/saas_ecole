# infra/docker/nginx/nginx.conf
#
# cf. PROJET_LARAVEL.md §9. Nginx ne fait plus de résolution de tenant
# (c'est Laravel qui lit le Host header) — il route tout vers le même
# upstream PHP-FPM, y compris les sous-domaines écoles et le domaine
# admin plateforme.

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream app { server app:9000; }

  server {
    listen 80;
    server_name ~^(?<tenant>.+)\.plateforme\.sn$ admin.plateforme.sn;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      fastcgi_pass app;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(js|css|png|jpg|svg|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }
}
